name: lolly-rag

# =============================================================================
# Lolly RAG — Unified Docker Compose Configuration
#
# Works for BOTH online development and offline air-gapped deployments:
#
#   Online:   docker compose up --build -d
#   Air-gap:  docker compose up -d
#
# For air-gap mode, pre-load images via: ./run-airgap-docker.sh (or docker load)
# Models are automatically loaded from local bind mounts:
#   • ./ollama-models/models → /root/.ollama/models
#   • ./.cache/huggingface   → /home/appuser/.cache/huggingface
# =============================================================================

services:
  local-AI:
    image: ollama/ollama:0.33.2
    container_name: localAI
    ports:
      - "11434:11434"
    deploy: {}
    gpus: all
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_DEBUG=0
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=${MAX_EMBED_WORKERS:-8}
      - OLLAMA_MAX_QUEUE=512
    volumes:
      - ollama_data:/root/.ollama
      - ${OLLAMA_MODELS_PATH:-./ollama-models/models}:/root/.ollama/models
    restart: unless-stopped
    networks:
      - lolly-rag
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  graphDB:
    container_name: lolly-DB
    image: neo4j:5.26
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - lolly-rag_data:/data
      - lolly-rag_logs:/logs
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_server_jvm_additional=--add-modules=jdk.incubator.vector
      - NEO4J_dbms_usage_report.enabled=false
    restart: unless-stopped
    networks:
      - lolly-rag
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-server:
    image: lolly-rag-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    group_add:
      - "1001" # Your host's docker group GID
    container_name: fastapi-server
    deploy: {}
    gpus: all
    restart: unless-stopped
    ports:
      - 8000:8000
    environment:
      - NEO4J_URL=bolt://graphDB:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - OLLAMA_BASE_URL=http://localAI:11434
      - MAX_EMBED_WORKERS=${workers:-8}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HOME=/home/appuser/.cache/huggingface
      - TORCH_HOME=/home/appuser/.cache/torch
    volumes:
      - ${HF_HOST_CACHE:-./.cache/huggingface}:/home/appuser/.cache/huggingface
      - ${TORCH_HOST_CACHE:-./.cache/torch}:/home/appuser/.cache/torch
    networks:
      - lolly-rag
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"
    depends_on:
      graphDB:
        condition: service_healthy
      local-AI:
        condition: service_healthy

  frontend:
    image: lolly-rag-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: streamlit-frontend
    ports:
      - 8511:8501
    environment:
      - BACKEND_URL=http://backend-server:8000
    restart: unless-stopped
    networks:
      - lolly-rag
    depends_on:
      backend-server:
        condition: service_started
      local-AI:
        condition: service_healthy

networks:
  lolly-rag:
    driver: bridge

volumes:
  lolly-rag_data:
  lolly-rag_logs:
  ollama_data:
