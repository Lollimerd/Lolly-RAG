version: '3.13.5'
name: lolly-rag

services:
  local-AI:
    image: ollama/ollama:0.32.1
    container_name: localAI
    ports:
      - "11434:11434"
    # gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu, compute, utility ]
    pull_policy: missing
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q4_0
      - OLLAMA_DEBUG=0
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=3
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - lolly-rag
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  graphDB:
    container_name: lolly-DB
    image: neo4j:5.26
    pull_policy: missing
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - lolly-rag_data:/data
      - lolly-rag_logs:/logs
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      - NEO4J_server_jvm_additional=--add-modules=jdk.incubator.vector
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_usage_report.enabled=false
    restart: unless-stopped
    networks:
      - lolly-rag
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    group_add:
      - "1001" # Your host's docker group GID
    container_name: fastapi-backend
    restart: unless-stopped
    ports:
      - 8000:8000
    environment:
      - NEO4J_URL=bolt://graphDB:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - OLLAMA_BASE_URL=http://localAI:11434
      - HF_HUB_OFFLINE=1 # TODO: Change this to 1 when we have all the models
      - HF_HOME=/home/appuser/.cache/huggingface
    networks:
      - lolly-rag
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu, compute, utility ]
    depends_on:
      graphDB:
        condition: service_healthy
      local-AI:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: streamlit-frontend
    pull_policy: missing
    ports:
      - 8501:8501
    environment:
      - BACKEND_URL=http://backend-server:8000
    restart: unless-stopped
    networks:
      - lolly-rag
    depends_on:
      backend-server:
        condition: service_started
      local-AI:
        condition: service_healthy

networks:
  lolly-rag:
    driver: bridge

volumes:
  lolly-rag_data:
  lolly-rag_logs:
  ollama_data:
